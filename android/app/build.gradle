apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def appApplicationId = "com.americabitcoinatm.wallet"

/**
 * Release signing.
 *
 * Values are resolved in this order:
 *   1. Gradle properties      (-PABA_UPLOAD_STORE_FILE=..., or ~/.gradle/gradle.properties)
 *   2. android/keystore.properties  (git-ignored, for local release builds)
 *   3. Environment variables        (used by CI)
 *
 * When nothing is configured, release builds stay unsigned, so the existing
 * apksigner-based APK flow and the Detox release build keep working unchanged.
 * `bundleRelease` refuses to run unsigned, because Play only accepts signed bundles.
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String propertyName, String envName ->
    def value
    if (project.hasProperty(propertyName)) {
        value = project.property(propertyName)
    } else if (keystoreProperties.containsKey(propertyName)) {
        value = keystoreProperties.getProperty(propertyName)
    } else {
        value = System.getenv(envName)
    }
    return (value == null || value.toString().trim().isEmpty()) ? null : value.toString().trim()
}

def uploadStoreFilePath = signingValue('ABA_UPLOAD_STORE_FILE', 'KEYSTORE_FILE')
def uploadStorePassword = signingValue('ABA_UPLOAD_STORE_PASSWORD', 'KEYSTORE_PASSWORD')
def uploadKeyAlias = signingValue('ABA_UPLOAD_KEY_ALIAS', 'KEYSTORE_KEY_ALIAS')
def uploadKeyPassword = signingValue('ABA_UPLOAD_KEY_PASSWORD', 'KEYSTORE_KEY_PASSWORD') ?: uploadStorePassword
def uploadStoreFile = uploadStoreFilePath == null ? null : rootProject.file(uploadStoreFilePath)
def hasUploadKey = uploadStoreFile != null && uploadStoreFile.exists() && uploadStorePassword != null && uploadKeyAlias != null

if (uploadStoreFilePath != null && !hasUploadKey) {
    logger.warn("Upload keystore configured but incomplete (file=${uploadStoreFilePath}, exists=${uploadStoreFile?.exists()}, " +
        "alias=${uploadKeyAlias != null}, password=${uploadStorePassword != null}). Release builds will be UNSIGNED.")
}

/**
 * Bugsnag notifier key. Falls back to the key this fork inherited from upstream so
 * local builds keep working; set BUGSNAG_API_KEY (or -PABA_BUGSNAG_API_KEY) to report
 * crashes into this app's own Bugsnag project instead of upstream BlueWallet's.
 */
def bugsnagApiKeyOverride = signingValue('ABA_BUGSNAG_API_KEY', 'BUGSNAG_API_KEY')
def bugsnagApiKey = bugsnagApiKeyOverride ?: '17ba9059f676f1cc4f45d98182388b01'
if (bugsnagApiKeyOverride == null) {
    logger.warn("WARNING: no Bugsnag key configured, falling back to the one inherited from upstream BlueWallet. " +
        "Crash reports from this build are delivered to their project, not ours. " +
        "Set BUGSNAG_API_KEY (or ABA_BUGSNAG_API_KEY) before shipping a production release.")
}

/**
 * google-services.json must declare a client for our applicationId, otherwise the
 * google-services plugin fails later with an error that is hard to place.
 */
def googleServicesJson = file("google-services.json")
if (googleServicesJson.exists()) {
    def declaredPackages = new groovy.json.JsonSlurper()
        .parse(googleServicesJson)
        .client
        .collect { it.client_info.android_client_info.package_name }
    if (!declaredPackages.contains(appApplicationId)) {
        throw new GradleException(
            "android/app/google-services.json declares no client for ${appApplicationId} (it declares ${declaredPackages}).\n" +
            "Firebase push notifications cannot build until this is fixed.\n" +
            "Fix: in the Firebase console, open your own project, add an Android app with package name\n" +
            "  ${appApplicationId}\n" +
            "then download the generated google-services.json and replace android/app/google-services.json with it.\n" +
            "In CI, supply the same file through the GOOGLE_SERVICES_JSON secret."
        )
    }
}

android {
    androidResources {
        noCompress += ["bundle"]
    }

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.americabitcoinatm.wallet"
    defaultConfig {
        applicationId appApplicationId
        manifestPlaceholders = [bugsnagApiKey: bugsnagApiKey]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "7.2.4"
        testBuildType System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', 'src/main/res/assets']
        }
    }

    signingConfigs {
        if (hasUploadKey) {
            release {
                storeFile uploadStoreFile
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            // Signed with the Play upload key when one is configured (see signingValue above).
            // Without it the release output stays unsigned, matching the legacy apksigner flow.
            if (hasUploadKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            proguardFile "${rootProject.projectDir}/../node_modules/detox/android/detox/proguard-rules-app.pro"
        }
    }

}

/**
 * Play only accepts signed App Bundles, so fail fast instead of producing an
 * unsigned .aab that gets rejected at upload time.
 */
gradle.taskGraph.whenReady { graph ->
    if (!hasUploadKey && graph.allTasks.any { it.name == "bundleRelease" }) {
        throw new GradleException(
            "Refusing to build an unsigned Android App Bundle.\n" +
            "Configure the Play upload key first, either in android/keystore.properties\n" +
            "(see android/keystore.properties.example) or through the KEYSTORE_FILE,\n" +
            "KEYSTORE_PASSWORD and KEYSTORE_KEY_ALIAS environment variables."
        )
    }
}

task copyFiatUnits(type: Copy) {
    from '../../models/fiatUnits.json'
    into 'src/main/assets'
}

/**
 * The icon fonts are checked in under src/main/assets/fonts, and this module
 * overrides assets.srcDirs, so those copies are what ends up in the APK rather
 * than the ones react-native-vector-icons ships. They had drifted years out of
 * date, which rendered every newer glyph as an empty box. Copy them from the
 * installed package on every build so they cannot drift again.
 */
task copyVectorIconFonts(type: Copy) {
    from '../../node_modules/react-native-vector-icons/Fonts'
    into 'src/main/assets/fonts'
    include '*.ttf'
}

preBuild.dependsOn(copyFiatUnits)
preBuild.dependsOn(copyVectorIconFonts)

dependencies {
		androidTestImplementation('com.wix:detox:+')
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.compose.ui:ui:1.9.4'
    implementation 'androidx.compose.material3:material3:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    androidTestImplementation('com.wix:detox:0.1.1')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
apply plugin: 'com.google.gms.google-services'  // Google Services plugin
apply plugin: "com.bugsnag.android.gradle"
